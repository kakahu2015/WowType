name: Windows TSF Prototype

on:
  push:
    branches: ['windows/phase2**', 'windows/phase2/**']
    paths:
      - 'windows/tsf/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-tsf.yml'
      - 'core/**'
      - 'voice/**'
      - 'Cargo.*'
  pull_request:
    paths:
      - 'windows/tsf/**'
      - 'scripts/windows/**'
      - '.github/workflows/windows-tsf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tsf:
    name: TSF DLL, registration and rollback
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          key: wowtype-win-tsf
      - name: Compile Rust and native TSF COM DLL
        shell: pwsh
        run: ./scripts/windows/Build-Tsf.ps1
      - name: Check TSF COM exports
        shell: pwsh
        run: |
          $symbols = & dumpbin.exe /exports dist/windows/WowTypeTSF.dll
          foreach ($symbol in @('DllGetClassObject','DllCanUnloadNow','DllRegisterServer','DllUnregisterServer')) {
            if (!($symbols -match " $symbol$")) { throw "Export missing: $symbol" }
          }
      - name: Full offline lexicon + language model core ABI regression
        shell: pwsh
        run: |
          & cl.exe /nologo /W4 /TC /Icore/include windows/core/abi_smoke.c /Fe:dist/windows/full_lexicon_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile core lexicon smoke' }
          & ./dist/windows/full_lexicon_smoke.exe ./dist/windows/wowtype_core.dll ./dist/windows/data/lexicon.tsv ./dist/windows/data/words.lm
          if ($LASTEXITCODE -ne 0) { throw 'Full lexicon / language model smoke failed' }
      - name: Automatic updater + paging regression
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/WowTypeTSF'
          # Registration step below is deliberately kept independent.
          if (!(Test-Path 'dist/windows/Update-Lexicon.ps1')) { throw 'Missing updater in artifact directory' }
      - name: Compile COM activation smoke
        shell: pwsh
        run: |
          & cl.exe /nologo /W4 /EHsc /std:c++20 /utf-8 windows/tsf/com_smoke.cpp /Fe:dist/windows/com_smoke.exe /link ole32.lib uuid.lib
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile native COM activation smoke' }
      - name: Per-user installer, COM activation and rollback smoke
        shell: pwsh
        run: |
          $key = 'Registry::HKEY_CURRENT_USER\Software\Classes\CLSID\{9aebaf46-3231-4f65-836d-0972c2396181}'
          try {
            & ./dist/windows/Install-Tsf.ps1
            if (!(Test-Path $key)) { throw 'Missing HKCU COM CLSID registration' }
            & ./dist/windows/com_smoke.exe
            if ($LASTEXITCODE -ne 0) { throw 'COM class activation failed' }
            $task = Get-ScheduledTask -TaskName 'WowTypeTSF-LexiconUpdate' -ErrorAction Stop
            if (!$task) { throw 'Auto-update scheduled task not registered' }
            $installed = Join-Path $env:LOCALAPPDATA 'Programs/WowTypeTSF'
            & ./dist/windows/Update-Lexicon.ps1 -InstallDir $installed -CheckOnly
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Updater version check failed' }
            # Exercise the transactional update with an actual upstream tarball.
            & ./dist/windows/Update-Lexicon.ps1 -InstallDir $installed -Force
            $active = Join-Path $installed 'data/active.txt'
            if (!(Test-Path $active)) { throw 'Transactional updater did not activate a version pointer' }
            $version = (Get-Content $active -Raw).Trim()
            $updated = Join-Path (Join-Path $installed 'data/versions') $version
            & ./dist/windows/full_lexicon_smoke.exe (Join-Path $installed 'wowtype_core.dll') (Join-Path $updated 'lexicon.tsv') (Join-Path $updated 'words.lm')
            if ($LASTEXITCODE -ne 0) { throw 'Activated lexicon failed native Rust engine smoke' }
          } finally {
            & ./dist/windows/Uninstall-Tsf.ps1
          }
          if (Test-Path $key) { throw 'Uninstall did not remove HKCU COM CLSID' }
          if (Get-ScheduledTask -TaskName 'WowTypeTSF-LexiconUpdate' -ErrorAction SilentlyContinue) {
            throw 'Uninstall left a recurring updater task behind'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wowtype-windows11-tsf-UNSIGNED-PROTOTYPE
          path: |
            dist/windows/WowTypeTSF.dll
            dist/windows/wowtype_core.dll
            dist/windows/data/demo_lexicon.tsv
            dist/windows/data/lexicon.tsv
            dist/windows/data/words.lm
            dist/windows/data/LICENSE
            dist/windows/data/SOURCE.txt
            dist/windows/data/VERSION
            dist/windows/data/english.txt
            dist/windows/Install-Tsf.ps1
            dist/windows/Uninstall-Tsf.ps1
            dist/windows/Update-Lexicon.ps1
            dist/windows/Manage-LexiconUpdate.ps1
            dist/windows/full_lexicon_smoke.exe
            dist/windows/WINDOWS-TSF.md
          if-no-files-found: error
          retention-days: 7
